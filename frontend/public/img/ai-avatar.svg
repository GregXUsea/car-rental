<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- 装饰环 -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
  <!-- 机器人脸 -->
  <rect x="35" y="40" width="50" height="40" rx="12" fill="url(#face)" filter="url(#shadow)"/>
  <!-- 天线 -->
  <line x1="60" y1="40" x2="60" y2="28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="25" r="4" fill="#FFD700"/>
  <!-- 左眼 -->
  <circle cx="48" cy="56" r="5" fill="#667eea"/>
  <circle cx="48" cy="56" r="2.5" fill="#fff"/>
  <!-- 右眼 -->
  <circle cx="72" cy="56" r="5" fill="#667eea"/>
  <circle cx="72" cy="56" r="2.5" fill="#fff"/>
  <!-- 嘴巴 -->
  <path d="M50 70 Q60 78 70 70" fill="none" stroke="#667eea" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 耳朵装饰 -->
  <rect x="28" y="52" width="8" height="16" rx="4" fill="#fff" opacity="0.3"/>
  <rect x="84" y="52" width="8" height="16" rx="4" fill="#fff" opacity="0.3"/>
  <!-- 底部装饰点 -->
  <circle cx="45" cy="95" r="2.5" fill="#FFD700" opacity="0.6"/>
  <circle cx="60" cy="98" r="2.5" fill="#FFD700" opacity="0.8"/>
  <circle cx="75" cy="95" r="2.5" fill="#FFD700" opacity="0.6"/>
</svg>