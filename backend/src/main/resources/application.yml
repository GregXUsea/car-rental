spark:
  api-key: ${SPARK_API_KEY:your-spark-api-key-here}
  api-secret: ${SPARK_API_SECRET:your-spark-api-secret-here}
  base-url: ${SPARK_BASE_URL:https://spark-api-open.xf-yun.com/v1}
  model: ${SPARK_MODEL:lite}

logging:
  level:
    com.carrental: debug

spring.servlet.multipart:
